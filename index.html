<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <h1 class="dash-title">STUDENT DASHBOARD</h1>
    <nav class="navbar">
      <div class="nav-links">
        <button class="nav-link active" data-view="home">HOME</button>
        <button class="nav-link" data-view="customize">CUSTOMIZE</button>
        <button class="nav-link" data-view="settings">SETTINGS</button>
        <button class="nav-link" data-view="how">HOW IT WORKS</button>
      </div>
    </nav>
  </header>

  <!-- ===== Toolbar ===== -->
  <div class="toolbar">
    <div class="toolbar-left">
      <button id="editToggle" class="tool-btn">✎ Edit Layout</button>
      <button id="addWidgetBtn" class="tool-btn">＋ Add Widget</button>
    </div>
    <div class="toolbar-right">
      <button id="themeBtn" class="tool-btn" title="Change accent">🎨 Theme</button>
      <button id="resetBtn" class="tool-btn subtle" title="Reset layout to default">↺ Reset</button>
    </div>
  </div>

  <!-- ===== The board ===== -->
  <main id="board" class="board"></main>

  <!-- ===== Add-widget drawer ===== -->
  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <h2>Add a widget</h2>
      <button id="drawerClose" class="icon-btn">✕</button>
    </div>
    <p class="drawer-sub">Click to drop it onto your board.</p>
    <div id="widgetGallery" class="widget-gallery"></div>
  </aside>

  <!-- ===== Generic modal ===== -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div id="modal" class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Title</h3>
        <button id="modalClose" class="icon-btn">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Theme palette popover -->
  <div id="themePop" class="theme-pop hidden"></div>

  <script src="app.js"></script>
</body>
</html>
